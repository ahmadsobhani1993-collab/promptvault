name: Gemini AI Assistant

# این بخش مجوز نوشتن و پوش کردن را به ربات می‌دهد (رفع خطای 403)
permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      task:
        description: 'What should Gemini do? (e.g., Fix header submit button)'
        required: true
        default: 'Add submit button to header in desktop view'

jobs:
  ai-coding:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Aider
        run: pip install aider-chat

      - name: Configure Git
        run: |
          git config user.name "Gemini AI Bot"
          git config user.email "gemini@github.com"

      - name: Run Gemini AI and Commit
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TASK: ${{ github.event.inputs.task }}
        run: |
          # استفاده از مدل صحیح و پایدار (gemini-2.0-flash)
          # اگر مدل دیگری مد نظرت است، نام دقیق آن را از سایت openrouter.ai/models کپی کن
          aider --model gemini/gemini-2.0-flash \
                --yes-always \
                --message "$TASK" \
                --commit
          
          # پوش کردن تغییرات به گیت‌هاب
          git push origin main
